<div class="register">
  <h2>Register</h2>

  <div *ngIf="mensajeError" class="error-message">
    {{ mensajeError }}
  </div>

  <div *ngIf="mensajeExito" class="success-message">
    {{ mensajeExito }}
  </div>

  <form [formGroup]="formularioRegistro" (ngSubmit)="enviar()">
    <label>
      Nombre:
      <input type="text" formControlName="nombre" />
    </label>

    <label>
      Apellido:
      <input type="text" formControlName="apellido" />
    </label>

    <label>
      Fecha de nacimiento:
      <input type="date" formControlName="fecha_nacimiento" />
    </label>

    <label>
      Tipo de sangre:
      <select formControlName="tipo_sangre">
        <option value="" disabled>Elegí un tipo</option>
        <option *ngFor="let tipo of tiposSangre" [value]="tipo">{{ tipo }}</option>
      </select>
    </label>

    <label>
      Color de ojos:
      <select formControlName="color_ojos">
        <option value="" disabled>Elegí un color</option>
        <option *ngFor="let color of coloresOjos" [value]="color">{{ color }}</option>
      </select>
    </label>

    <label>
      Email:
      <input type="email" formControlName="correo" />
    </label>

    <label>
      Password:
      <input type="password" formControlName="contrasena" />
    </label>

    <button type="submit">Registrarse</button>
  </form>

  <a routerLink="/auth/login">Iniciar sesión</a>
</div>
