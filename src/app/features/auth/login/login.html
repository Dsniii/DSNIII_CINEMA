<div class="login-form">
  <h2>Login</h2>

  <div *ngIf="mensajeError" class="error-message" role="alert">
    {{ mensajeError }}
  </div>

  <form [formGroup]="formularioLogin" (ngSubmit)="enviar()">
    <label>
      Email:
      <input type="email" formControlName="correo" />
    </label>

    <label>
      Password:
      <input type="password" formControlName="contrasena" />
    </label>

    <button type="submit">Ingresar</button>
  </form>

  <a routerLink="/auth/registro">Registrarse</a>
</div>
